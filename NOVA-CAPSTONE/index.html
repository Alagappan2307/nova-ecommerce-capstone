<!DOCTYPE html>
<html lang="en">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f0">
    <meta name="description" content="NOVA — thoughtfully designed everyday essentials.">

    <title>NOVA — Objects for Better Living</title>

    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="header">
        <a class="logo" href="/" data-link aria-label="NOVA home">
            NOVA<span>®</span>
        </a>

        <nav class="navigation" id="navigation" aria-label="Main navigation">
            <a href="/" data-link data-nav="home">Home</a>
            <a href="/collection" data-link data-nav="collection">Collection</a>
            <a href="/story" data-link data-nav="story">Our story</a>
        </nav>

        <div class="header-actions">
            <button class="icon-button" id="search-open" type="button"
                    aria-label="Open product search">⌕</button>

            <a href="/cart" data-link class="bag-link">
                Bag <span id="cart-count" class="cart-count">0</span>
            </a>

            <button class="menu-button" id="menu-toggle"
                    type="button" aria-label="Open navigation"
                    aria-expanded="false">
                <span></span><span></span>
            </button>
        </div>
    </header>

    <main id="main" tabindex="-1">
        <div id="app"></div>
    </main>

    <footer class="footer">
        <div class="footer-top">
            <a href="/" data-link class="logo">NOVA<span>®</span></a>
            <p>Useful things. Considered carefully.</p>
            <a href="#main" class="footer-top-link">Back to top ↑</a>
        </div>

        <div class="footer-bottom">
            <span>© <span id="year"></span> NOVA Studio</span>
            <span>Designed for everyday life.</span>
            <a href="/story" data-link>Our principles ↗</a>
        </div>
    </footer>

    <dialog id="search-dialog" class="search-dialog"
            aria-labelledby="search-heading">
        <form method="dialog" class="dialog-close">
            <button type="submit" class="icon-button"
                    aria-label="Close search">×</button>
        </form>

        <p class="eyebrow">FIND YOUR NEXT FAVOURITE</p>
        <h2 id="search-heading">What are you looking for?</h2>

        <form id="search-form" class="search-form">
            <label for="search-input" class="visually-hidden">
                Search products
            </label>
            <input id="search-input" type="search"
                   placeholder="Try lamp, bottle or carry"
                   required>
            <button type="submit" class="button button-dark">Search ↗</button>
        </form>

        <p class="muted small">Search products by name, category or description.</p>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
